description:
  it:
    shortDescription: Applicazione web della Regione Basilicata per la gestione digitale di fascicoli, documenti e relativi allegati
    longDescription: >-
      PAIAA è un'applicazione web sviluppata per supportare la gestione
      digitale di fascicoli, documenti e relativi allegati.

      La soluzione comprende funzionalità per l'organizzazione dei fascicoli,
      la gestione degli allegati, il controllo delle modifiche e la
      conservazione delle versioni.

      Il progetto è pubblicato dalla Regione Basilicata in versione beta,
      in quanto ancora sottoposto a validazione tecnica, amministrativa,
      funzionale, di sicurezza e di accessibilità.

      Il repository contiene il codice sorgente, la configurazione Docker,
      i test automatici, la documentazione tecnica e le indicazioni
      necessarie per l'installazione e l'esecuzione del software.
features:
      - Gestione digitale dei fascicoli
      - Gestione di documenti e allegati
      - Controllo delle modifiche
      - Conservazione delle versioni
      - Configurazione dell'ambiente mediante Docker
      - Test automatici
      - Documentazione tecnica per l'installazione e l'utilizzo
